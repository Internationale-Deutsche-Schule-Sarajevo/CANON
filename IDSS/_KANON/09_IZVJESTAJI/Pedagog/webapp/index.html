<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-c/4rvTMMx866ktcp3/V8zuZsE06RSDh/zrTCLY6EuwM=' 'sha256-KOgU4/EeqCz4TsMZFUHKbPsEAqq27CQAckmiYOYyD00=' 'sha256-FBcsSa+B8+JXWeth1G0RB3+nZ8TPE79qCWEccxRaSOU=' 'sha256-cZvt9fvwC+Icdnk1yqzCAUxeQxAzjbXtsLkJ2KR8MO8='; style-src 'unsafe-inline'; img-src https://idss.edu.ba data:; connect-src https://mundbastjijqnhpvdtzj.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>IDSS Pedagog · Mjesečni izvještaj</title>
<style>
:root{
  /* Službena paleta IDSS: #000000, #08ABE6, #E8262C, #035EA1, #FFCB29 (+ bijela i neutralne nijanse crne za pozadine i tekst) */
  --crna:#000000; --svijetloplava:#08ABE6; --crvena:#E8262C; --plava:#035EA1; --zuta:#FFCB29;
  --p9:#000000; --p8:#000000; --p7:#035EA1; --p6:#035EA1;
  --brass:#FFCB29; --brass-l:#FFCB29; --brass-d:#000000;
  --porc:#F4F7FA; --paper:#fff; --ink:#000000; --ink2:#474747; --line:#cfd6dc; --line2:#e6ebef;
  --red:#E8262C; --red-bg:#FDE9EA; --green:#035EA1; --green-bg:#E6EFF6; --amber:#000000; --amber-bg:#FFF2C4; --blue:#035EA1; --blue-bg:#E1F5FC;
  --g1:#FFCB29; --g2:#08ABE6; --g3:#ffffff; --g4:#E8262C;
  --sans:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"SF Pro Text","Helvetica Neue",Roboto,Arial,sans-serif;
  --serif:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"SF Pro Display","Helvetica Neue",Roboto,Arial,sans-serif;
  --r:8px; --senka:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--porc);color:var(--ink);font:16px/1.5 var(--sans);min-height:100vh}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0 0 .5em;letter-spacing:-.012em}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0 0 .8em}
a{color:var(--blue)}
.skok{position:absolute;left:-999px;top:0;background:var(--brass);color:#000000;padding:.6rem 1rem;z-index:100}
.skok:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
.sakriveno{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;cursor:pointer}
.tabular{font-variant-numeric:tabular-nums}

/* ---------- gornja traka ---------- */
.traka{background:var(--p9);color:#ededed;border-bottom:3px solid var(--brass)}
.traka-u{max-width:none;margin:0;padding:.6rem var(--gut);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.marka{display:flex;align-items:center;gap:.8rem;min-width:0}
.marka img{height:38px;width:auto;display:block}
.marka .tekst{font-family:var(--serif);font-size:1.15rem;line-height:1.1}
.marka .tekst small{display:block;font:.78rem var(--sans);color:#aeaeae;letter-spacing:.02em}
.traka .razmak{flex:1}
.korisnik{font-size:.88rem;text-align:right;line-height:1.25}
.korisnik b{display:block;font-weight:600}
.uloga{display:inline-block;background:var(--p7);border:1px solid var(--p6);border-radius:99px;padding:.05rem .6rem;font-size:.76rem;color:#dadada}
.dugme-traka{background:transparent;color:#ededed;border:1px solid #5f5f5f;border-radius:var(--r);padding:.4rem .8rem;min-height:40px}
.dugme-traka:hover{background:var(--p7)}
.nav{background:#035EA1}
.nav-u{max-width:none;margin:0;padding:0 var(--gut);display:flex;gap:.25rem;overflow-x:auto}
.nav a{color:#fff;text-decoration:none;padding:.75rem 1rem;border-bottom:3px solid transparent;white-space:nowrap;display:inline-block}
.nav a:hover{background:#000}
.nav a[aria-current=page]{color:#fff;border-bottom-color:var(--brass);background:#000}
.demo-traka{background:var(--amber-bg);color:#000000;border-bottom:1px solid #FFCB29;font-size:.9rem}
.demo-traka div{max-width:none;margin:0;padding:.45rem var(--gut);display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.demo-traka button{background:#fff;border:1px solid #FFCB29;border-radius:var(--r);padding:.25rem .7rem;min-height:32px}

main{max-width:none;margin:0;padding:1.4rem var(--gut) 4rem}
.naslov-stranice{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.naslov-stranice h1{margin:0}
.podnaslov{color:var(--ink2);margin:.2rem 0 0}

/* ---------- komponente ---------- */
.kartica{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--senka);padding:1.1rem 1.2rem}
.kartica>h2:first-child,.kartica>h3:first-child{margin-top:0}
.mreza{display:grid;gap:1rem}
.m2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.m3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.m4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.dugme{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.55rem 1.1rem;border-radius:var(--r);border:1px solid var(--p7);background:var(--p7);color:#fff;font-weight:600;text-decoration:none}
.dugme:hover{background:var(--p8)}
.dugme.zlato{background:var(--brass);border-color:var(--brass-d);color:#000000}
.dugme.zlato:hover{background:var(--brass-l)}
.dugme.sekund{background:#fff;color:var(--ink);border-color:#ababab}
.dugme.sekund:hover{background:var(--porc)}
.dugme.opasno{background:var(--red);border-color:#000000}
.dugme.zeleno{background:var(--green);border-color:#035EA1}
.dugme[disabled],.dugme[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.dugme.malo{min-height:36px;padding:.3rem .8rem;font-size:.9rem}
.cip{display:inline-flex;align-items:center;gap:.35rem;border-radius:99px;padding:.1rem .65rem;font-size:.82rem;font-weight:600;border:1px solid;white-space:nowrap}
.cip.nacrt{background:#f0f0f0;color:#424242;border-color:#cacaca}
.cip.podnesen{background:var(--blue-bg);color:#035EA1;border-color:#08ABE6}
.cip.vracen{background:var(--amber-bg);color:var(--amber);border-color:#FFCB29}
.cip.odobren{background:var(--green-bg);color:var(--green);border-color:#08ABE6}
.cip.nema{background:#fff;color:#575757;border-color:var(--line);border-style:dashed}
.cip.kasni{background:var(--red-bg);color:var(--red);border-color:#FDE9EA}
.cip.ok{background:var(--green-bg);color:var(--green);border-color:#08ABE6}
.upozorenje,.info,.greska-okvir,.uspjeh{border-left:4px solid;border-radius:4px;padding:.7rem .9rem;margin:.8rem 0;font-size:.95rem}
.upozorenje{background:var(--amber-bg);border-color:#FFCB29;color:#000000}
.info{background:var(--blue-bg);border-color:var(--blue);color:#035EA1}
.greska-okvir{background:var(--red-bg);border-color:var(--red);color:#000000}
.uspjeh{background:var(--green-bg);border-color:var(--green);color:#035EA1}
.prazno{text-align:center;color:var(--ink2);padding:1.5rem 1rem}
.prazno strong{display:block;color:var(--ink);font-family:var(--serif);font-size:1.1rem;margin-bottom:.3rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:.85rem;border-bottom:1px solid var(--line)}
td.br,th.br{text-align:right}
.tabela-omot{overflow-x:auto}
.plocica{display:flex;flex-direction:column;gap:.15rem}
.plocica .br{font:700 2rem/1 var(--serif);font-variant-numeric:tabular-nums}
.plocica .on{color:var(--ink2);font-size:.9rem}
.plocica.opasno .br{color:var(--red)}
.plocica.pazi .br{color:var(--amber)}

/* ---------- hero sa 3D scenom ---------- */
.hero{background:radial-gradient(120% 100% at 30% 0%,#035EA1 0%,var(--p8) 45%,var(--p9) 100%);color:#ededed;border-radius:10px;border:1px solid #000000;box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:1rem;overflow:hidden}
.hero .platno{position:relative;min-height:300px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .tekst{padding:1.4rem 1.4rem 1.4rem 0;align-self:center}
.hero h2{color:#fff;font-size:1.5rem}
.hero .velik{font:700 3.4rem/1 var(--serif);color:var(--brass-l);font-variant-numeric:tabular-nums}
.hero .velik small{font-size:1.1rem;color:#aeaeae;font-weight:400}
.hero p{color:#d0d0d0}
.rez-grupe{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.45rem}
.rez-grupe li{display:grid;grid-template-columns:9.5rem 1fr auto;gap:.6rem;align-items:center;font-size:.92rem}
.traka-b{height:9px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.traka-b i{display:block;height:100%;border-radius:99px;transition:width .5s}
.svjetla .traka-b{background:#e8e8e8}
.bez-3d{display:flex;align-items:center;justify-content:center;height:100%;padding:1rem}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .tekst{padding:0 1.2rem 1.4rem}.hero .platno{min-height:240px}.rez-grupe li{grid-template-columns:7.5rem 1fr auto}}

/* ---------- staza mjeseci ---------- */
.staza{display:grid;gap:.6rem}
.mjesec{display:grid;grid-template-columns:7.5rem 1fr auto;gap:.8rem;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid #c2c2c2;border-radius:var(--r);padding:.7rem .9rem}
.mjesec.nacrt{border-left-color:#898989}.mjesec.podnesen{border-left-color:var(--blue)}.mjesec.vracen{border-left-color:#FFCB29}.mjesec.odobren{border-left-color:var(--green)}.mjesec.kasni{border-left-color:var(--red)}
.mjesec .naziv{font:700 1.05rem var(--serif)}
.mjesec .sitno{color:var(--ink2);font-size:.88rem}
.mjesec .bod{font:700 1.35rem var(--serif);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.mjesec{grid-template-columns:1fr auto}.mjesec .naziv{grid-column:1/-1}}
.znacke{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;list-style:none;margin:0;padding:0}
.znacka{border:1px solid var(--line);border-radius:var(--r);padding:.6rem .7rem;background:#fff;display:flex;gap:.6rem;align-items:flex-start;font-size:.88rem}
.znacka .ikona{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#e6e6e6;color:#686868;border:2px dashed #ababab}
.znacka.stecena .ikona{background:radial-gradient(circle at 35% 30%,#FFCB29,var(--brass) 60%,#FFCB29);color:#000000;border:2px solid var(--brass-d)}
.znacka b{display:block}
.znacka .sitno{color:var(--ink2)}
.znacka:not(.stecena){color:#575757}

/* ---------- uređivač ---------- */
.uredjivac{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:1rem;align-items:start}
.bocna{position:sticky;top:.8rem;display:flex;flex-direction:column;gap:1rem}
.bocna-s{position:sticky;top:.8rem}
.korak-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.15rem}
.korak-lista a{display:grid;grid-template-columns:1.7rem 1fr auto;gap:.4rem;align-items:center;padding:.55rem .6rem;border-radius:var(--r);text-decoration:none;color:var(--ink);border:1px solid transparent;min-height:44px}
.korak-lista a:hover{background:var(--porc)}
.korak-lista a[aria-current=step]{background:#eeeeee;border-color:#c6c6c6;font-weight:600}
.korak-lista .br{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:#e8e8e8;color:#404040;font-weight:700}
.korak-lista .gotov .br{background:var(--green);color:#fff}
.korak-lista .nedostaje{font-size:.78rem;color:var(--red);font-weight:600}
.forma-sek{display:flex;flex-direction:column;gap:1rem}
.polje{display:flex;flex-direction:column;gap:.3rem}
.polje>label,.polje>.oznaka{font-weight:600;font-size:.95rem}
.polje .pomoc{color:var(--ink2);font-size:.86rem;flex:1 0 auto}
.polje>label:not(:has(+.pomoc)):not(:last-child){flex:1 0 auto}
.polje>label:last-child{flex:0 0 auto}
.polje .gr{color:var(--red);font-size:.88rem;font-weight:600;min-height:0}
input[type=text],input[type=number],input[type=date],select,textarea,input[type=email],input[type=password],input[type=url]{font:inherit;color:var(--ink);background:#fff;border:1px solid #9b9b9b;border-radius:var(--r);padding:.5rem .65rem;min-height:44px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.45}
input[type=number]{max-width:100%}
input:disabled,select:disabled,textarea:disabled{background:#f0f0f0;color:#565656}
.ima-gr input,.ima-gr select,.ima-gr textarea{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.brojac-znakova{font-size:.82rem;color:var(--ink2);text-align:right}
.brojac-znakova.mali{color:var(--amber)}
.red-polja{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:1rem 1.25rem;align-items:stretch}
.izbor{display:flex;flex-wrap:wrap;gap:.45rem}
.izbor label{display:inline-flex;align-items:center;gap:.4rem;border:1px solid #ababab;border-radius:99px;padding:.3rem .8rem;background:#fff;min-height:40px;cursor:pointer;font-weight:400}
.izbor input{width:1.05rem;height:1.05rem;margin:0}
.izbor label:has(input:checked){background:#E1F5FC;border-color:var(--p6);font-weight:600}
.izbor label:has(input:disabled){opacity:.6;cursor:not-allowed}
.stavka-k{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:.9rem;display:flex;flex-direction:column;gap:.8rem}
.stavka-k header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.stavka-k header b{font-family:var(--serif)}
.status-spremanja{display:inline-flex;align-items:center;gap:.45rem;border-radius:99px;padding:.15rem .75rem;font-size:.86rem;font-weight:600;border:1px solid}
.status-spremanja i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.ss-ok{color:var(--green);background:var(--green-bg);border-color:#08ABE6}
.ss-nesp{color:var(--amber);background:var(--amber-bg);border-color:#FFCB29}
.ss-radi{color:#035EA1;background:var(--blue-bg);border-color:#08ABE6}
.ss-gr{color:var(--red);background:var(--red-bg);border-color:#FDE9EA}
.ss-radi i{animation:puls 1s infinite}
@keyframes puls{50%{opacity:.25}}
.pano{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:1rem}
.bodovi-ploca h3{margin-bottom:.2rem}
.bodovi-ploca canvas{width:100%;height:210px;display:block;background:radial-gradient(120% 100% at 50% 0,#035EA1,var(--p9));border-radius:8px}
.bodovi-ploca .ukupno{font:700 2.1rem/1 var(--serif);font-variant-numeric:tabular-nums;margin:.6rem 0 .2rem}
.bodovi-ploca .ukupno small{font:.9rem var(--sans);color:var(--ink2)}
.pr-lista{list-style:none;margin:.5rem 0 0;padding:0;display:grid;gap:.5rem;font-size:.9rem}
.pr-lista li{display:grid;grid-template-columns:1fr auto;gap:.2rem .5rem}
.pr-lista .traka-b{grid-column:1/-1;background:#e8e8e8}
.nacin{display:flex;gap:.5rem;align-items:center;margin-top:.6rem;font-size:.88rem}
@media (max-width:1100px){.uredjivac{grid-template-columns:220px minmax(0,1fr)}.bocna-s{grid-column:1/-1;position:static;order:-1}}
@media (max-width:780px){.uredjivac{grid-template-columns:1fr}.bocna{position:static}.korak-lista{flex-direction:row;overflow-x:auto}.korak-lista a{min-width:8.5rem}.korak-lista .nedostaje{display:none}}

/* ---------- prijava ---------- */
.prijava-omot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0,#035EA1,var(--p9));padding:1rem}
.prijava{background:#fff;border-radius:10px;padding:1.8rem;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:4px solid var(--brass)}
.prijava img{height:46px;background:var(--p9);padding:.4rem .7rem;border-radius:6px;margin-bottom:1rem}
.prijava form{display:flex;flex-direction:column;gap:.9rem}

/* ---------- modal ---------- */
dialog{border:none;border-radius:10px;padding:0;max-width:min(560px,calc(100vw - 2rem));width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.62)}
dialog .okvir{padding:1.3rem 1.4rem}
dialog .okvir h2{margin-top:0}
dialog .dugmad{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1.1rem}
dialog.sirok{max-width:min(760px,calc(100vw - 2rem))}
.slavlje-canvas{width:100%;height:260px;display:block;background:radial-gradient(120% 100% at 50% 0,#035EA1,var(--p9));border-radius:8px;margin:.6rem 0}
.toast-sp{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none;width:min(520px,calc(100vw - 2rem))}
.toast{background:var(--p9);color:#fff;border-left:4px solid var(--brass);padding:.7rem 1rem;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:auto;font-size:.95rem;width:100%}
.toast.greska{border-left-color:#FDE9EA}
.ucitava{display:grid;place-items:center;min-height:40vh;color:var(--ink2)}
.vrti{width:28px;height:28px;border-radius:50%;border:3px solid #d6d6d6;border-top-color:var(--p7);animation:vrt 1s linear infinite;margin-bottom:.6rem}
@keyframes vrt{to{transform:rotate(360deg)}}
.pregled-sek{display:grid;gap:.5rem}
.pregled-sek dl{display:grid;grid-template-columns:minmax(150px,260px) 1fr;gap:.35rem 1rem;margin:0}
.pregled-sek dt{color:var(--ink2);font-size:.92rem}
.pregled-sek dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:640px){.pregled-sek dl{grid-template-columns:1fr}.pregled-sek dd{margin-bottom:.5rem}}
.ocjena{display:flex;gap:.4rem;flex-wrap:wrap}
.ocjena label{display:inline-flex;align-items:center;justify-content:center;border:1px solid #ababab;border-radius:var(--r);min-width:46px;min-height:46px;cursor:pointer;font-weight:700;background:#fff}
.ocjena label:has(input:checked){background:var(--brass);border-color:var(--brass-d)}
.ocjena input{position:absolute;opacity:0}
.ocjena label:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
.vremenska{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:.4rem}
.vremenska li{padding:.1rem 0 .8rem 1rem;position:relative}
.vremenska li::before{content:"";position:absolute;left:-.45rem;top:.35rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--p7)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
@media print{.traka,.nav,.bocna,.bocna-s,.demo-traka,.dugme,.toast-sp{display:none!important}body{background:#fff}.kartica{box-shadow:none}}
.uredjivac>*{min-width:0}
@media (max-width:780px){.bocna .kartica{overflow-x:auto;padding:.5rem}.korak-lista li{flex:0 0 auto}}

:root{--gut:max(clamp(1rem,2.4vw,3rem),env(safe-area-inset-left),env(safe-area-inset-right))}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
.korisnik .kontakt{display:block;font-size:.78rem;opacity:.8;font-weight:400}
@media (max-width:900px){.korisnik .kontakt{display:none}}
@media (max-width:760px){input,select,textarea{font-size:16px}}
@media (min-width:1700px){html{font-size:106%}}
@media (min-width:2300px){html{font-size:118%}}
[hidden]{display:none!important}

body{font-feature-settings:"tnum" 0,"cv11" 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.tabular,.plocica .br,.hero .velik,.bod,.ukupno{font-feature-settings:"tnum" 1;font-weight:800}
/* kontrast: fokus na tamnim površinama, greške crnim tekstom uz crveni naglasak */

<script>/* =====================================================================
   LOGIKA — validacija, KPI pokazatelji, IDSS bodovi, rokovi.
   Ovo je tačno ogledalo SQL funkcija iz supabase/002_validacija_bodovi.sql.
   Server je mjerodavan; ovdje se samo računa za trenutni prikaz i demo-režim.
   Paritet JS <-> SQL provjerava tests/30_paritet.mjs.
   ===================================================================== */
const Logika = (() => {
  'use strict';
  const ENUM = {
    teme: ['Ponašanje','Učenje i ocjene','Emocionalna podrška','Socijalna integracija','Daroviti učenici',
           'Inkluzivna podrška','Adaptacija novih učenika','Prelazak u viši razred',
           'Vršnjačko nasilje i sigurnost','Profesionalna orijentacija'],
    daNe: ['Da','Ne'],
    ednevnik: ['Uredno','U toku','Zahtijeva intervenciju'],
    grupe: ['učenici','nastavnici','roditelji'],
    radStatus: ['održano','otkazano','prebačeno'],
    usavrsavanje: ['seminar','webinar','stručni skup','mentorski rad','samostalno učenje','ostalo'],
    kategorija: ['Pedagoški / Ponašanje','Akademski','Sigurnosni / Zaštita djece','Organizacijski'],
    ozbiljnost: ['Nizak','Srednji','Visok','Kritičan'],
    statusRizika: ['Otvoreno','U toku','Riješeno','Eskalirano'],
    utjecaj: ['Nema troškova','Potreban budžet','Kadrovska odluka','Organizacijska izmjena'],
    odluka: ['Na čekanju','Odobreno','Odbijeno','Potrebna dorada'],
  };
  const MJESECI = ['januar','februar','mart','april','maj','juni','juli','august','septembar','oktobar','novembar','decembar'];
  const MJESECI_G = ['januara','februara','marta','aprila','maja','juna','jula','augusta','septembra','oktobra','novembra','decembra'];

  const isObj = x => x !== null && typeof x === 'object' && !Array.isArray(x);
  const len = s => Array.from(String(s)).length;                 // broj znakova (kao char_length)
  const btrim = s => String(s).replace(/^ +| +$/g, '');          // kao PostgreSQL btrim: samo razmaci
  const G = (polje, kod, poruka) => ({ polje, kod, poruka });
  const ci = (o, k) => (o && typeof o[k] === 'number' && Number.isInteger(o[k]) && Math.abs(o[k]) <= 2147483647) ? o[k] : null;
  const tk = (o, k) => (o && typeof o[k] === 'string') ? btrim(o[k]) : null;
  const obj = (s, k) => (isObj(s) && isObj(s[k])) ? s[k] : {};
  const nil = v => v === undefined || v === null;
  const pad2 = n => String(n).padStart(2, '0');

  function jeDatum(t) {
    if (typeof t !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(t)) return false;
    const [y, m, d] = t.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }
  const jeUuid = t => typeof t === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(t);
  function fmtDatum(iso) {            // 2026-10-06 -> 06.10.2026.
    if (!iso) return '';
    const [y, m, d] = String(iso).slice(0, 10).split('-');
    return `${d}.${m}.${y}.`;
  }
  const krajMjeseca = (g, m) => { const d = new Date(Date.UTC(g, m, 0)); return `${g}-${pad2(m)}-${pad2(d.getUTCDate())}`; };

  /* ---------- element-validatori (isti poruke i kodovi kao SQL) ---------- */
  function eCijeli(o, k, naziv, mn, mx, obavezno, put) {
    const v = o[k];
    if (nil(v)) return obavezno ? [G(`${put}.${k}`, 'OBAVEZNO', `${naziv} je obavezno polje (unesite 0 ako nema aktivnosti).`)] : [];
    if (typeof v !== 'number' || !Number.isInteger(v)) return [G(`${put}.${k}`, 'TIP', `${naziv} mora biti cijeli broj.`)];
    if (v < mn || v > mx) return [G(`${put}.${k}`, 'RASPON', `${naziv} mora biti između ${mn} i ${mx}.`)];
    return [];
  }
  function eTekst(o, k, naziv, mn, mx, obavezno, put) {
    const v = o[k];
    if (nil(v)) return obavezno ? [G(`${put}.${k}`, 'OBAVEZNO', `${naziv} je obavezno polje.`)] : [];
    if (typeof v !== 'string') return [G(`${put}.${k}`, 'TIP', `${naziv} mora biti tekst.`)];
    const tt = btrim(v);
    if (/[\x01-\x08\x0B\x0C\x0E-\x1F]/.test(v)) return [G(`${put}.${k}`, 'ZNAKOVI', `${naziv} sadrži nedozvoljene kontrolne znakove.`)];
    if (len(v) > mx) return [G(`${put}.${k}`, 'PRODUGO', `${naziv} može imati najviše ${mx} znakova.`)];
    if (obavezno) {
      if (tt === '') return [G(`${put}.${k}`, 'OBAVEZNO', `${naziv} je obavezno polje.`)];
      if (len(tt) < mn) return [G(`${put}.${k}`, 'PREKRATKO', `${naziv} mora imati najmanje ${mn} znakova (trenutno ${len(tt)}).`)];
    }
    return [];
  }
  function eEnum(o, k, naziv, dozv, obavezno, put) {
    const v = o[k];
    if (nil(v)) return obavezno ? [G(`${put}.${k}`, 'OBAVEZNO', `${naziv} je obavezno polje.`)] : [];
    if (typeof v !== 'string' || !dozv.includes(v)) return [G(`${put}.${k}`, 'VRIJEDNOST', `${naziv} ima nedozvoljenu vrijednost.`)];
    return [];
  }
  function eVise(o, k, naziv, dozv, mn, obavezno, put) {
    const v = o[k];
    if (nil(v)) return obavezno ? [G(`${put}.${k}`, 'OBAVEZNO', `${naziv} je obavezno polje.`)] : [];
    if (!Array.isArray(v)) return [G(`${put}.${k}`, 'TIP', `${naziv} mora biti lista.`)];
    const dobri = v.filter(e => typeof e === 'string' && dozv.includes(e)).length;
    const razl = new Set(v.map(e => (typeof e === 'string' ? 's:' + e : 'x:' + JSON.stringify(e)))).size;
    if (dobri !== v.length) return [G(`${put}.${k}`, 'VRIJEDNOST', `${naziv} sadrži nedozvoljenu vrijednost.`)];
    if (razl !== v.length) return [G(`${put}.${k}`, 'DUPLIKAT', `${naziv} sadrži ponovljene vrijednosti.`)];
    if (obavezno && v.length < mn) return [G(`${put}.${k}`, 'OBAVEZNO', `${naziv}: odaberite najmanje ${mn}.`)];
    return [];
  }
  function eDatum(o, k, naziv, obavezno, put, od, doo) {
    const v = o[k];
    if (nil(v) || (typeof v === 'string' && btrim(v) === '')) return obavezno ? [G(`${put}.${k}`, 'OBAVEZNO', `${naziv} je obavezno polje.`)] : [];
    if (typeof v !== 'string' || !jeDatum(v)) return [G(`${put}.${k}`, 'TIP', `${naziv} mora biti ispravan datum (GGGG-MM-DD).`)];
    if (od && v < od) return [G(`${put}.${k}`, 'RASPON', `${naziv} ne smije biti prije ${fmtDatum(od)}.`)];
    if (doo && v > doo) return [G(`${put}.${k}`, 'RASPON', `${naziv} ne smije biti poslije ${fmtDatum(doo)}.`)];
    return [];
  }

  /* ---------- Validacija sadržaja ---------- */
  function provjeriSadrzaj(s, strogo, godina, mjesec) {
    if (!isObj(s)) return [G('sadrzaj', 'TIP', 'Sadržaj izvještaja mora biti objekat.')];
    let e = [];
    const od = `${godina}-${pad2(mjesec)}-01`, doo = krajMjeseca(godina, mjesec);
    for (const sek of ['ucenici', 'nastavnici', 'roditelji', 'radionice', 'usavrsavanje', 'administracija', 'zakljucak']) {
      if (sek in s && !(isObj(s[sek]) || s[sek] === null)) e.push(G(sek, 'TIP', `Odjeljak „${sek}“ mora biti objekat.`));
    }
    const u = obj(s, 'ucenici'), n = obj(s, 'nastavnici'), r = obj(s, 'roditelji'), rad = obj(s, 'radionice'),
          usv = obj(s, 'usavrsavanje'), a = obj(s, 'administracija'), z = obj(s, 'zakljucak');

    e = e.concat(
      eCijeli(u, 'individualni_razgovori', 'Broj individualnih razgovora', 0, 500, strogo, 'ucenici'),
      eCijeli(u, 'razliciti_ucenici', 'Broj različitih učenika', 0, 500, strogo, 'ucenici'),
      eCijeli(u, 'grupni_rad', 'Broj grupnih/razrednih aktivnosti', 0, 200, strogo, 'ucenici'),
      eCijeli(u, 'daroviti_ucenici', 'Broj darovitih učenika u radu', 0, 200, strogo, 'ucenici'));
    const ind = ci(u, 'individualni_razgovori'), raz = ci(u, 'razliciti_ucenici');
    e = e.concat(
      eVise(u, 'teme', 'Teme rada sa učenicima', ENUM.teme, 1, strogo && (ind || 0) > 0, 'ucenici'),
      eTekst(u, 'sazetak', 'Sažetak rada sa učenicima', 50, 2500, strogo, 'ucenici'));
    if (ind !== null && raz !== null && raz > ind)
      e.push(G('ucenici.razliciti_ucenici', 'NEUSKLADJENO', 'Broj različitih učenika ne može biti veći od broja individualnih razgovora.'));

    e = e.concat(
      eCijeli(n, 'posjete_planirano', 'Planirane posjete časovima', 0, 200, strogo, 'nastavnici'),
      eCijeli(n, 'posjete_realizirano', 'Realizirane posjete časovima', 0, 200, strogo, 'nastavnici'),
      eCijeli(n, 'konsultacije', 'Broj konsultacija sa nastavnicima', 0, 500, strogo, 'nastavnici'),
      eCijeli(n, 'mentorstvo_sati', 'Sati mentorstva i stručne pomoći', 0, 200, strogo, 'nastavnici'),
      eCijeli(n, 'sastanci_vijeca', 'Broj sjednica vijeća', 0, 50, strogo, 'nastavnici'));
    const pl = ci(n, 'posjete_planirano'), re = ci(n, 'posjete_realizirano');
    e = e.concat(
      eTekst(n, 'razredi', 'Razredi u kojima su posjećeni časovi', 1, 250, strogo && (re || 0) > 0, 'nastavnici'),
      eTekst(n, 'nalazi', 'Nalazi posjeta časovima', 50, 2500, strogo && (re || 0) > 0, 'nastavnici'),
      eTekst(n, 'obrazlozenje_prekoracenja', 'Obrazloženje prekoračenja plana posjeta', 20, 1000, strogo && re !== null && pl !== null && re > pl, 'nastavnici'),
      eTekst(n, 'koordinacija', 'Koordinacija sa nastavnicima i stručnim organima', 30, 2000, strogo, 'nastavnici'));

    e = e.concat(
      eCijeli(r, 'individualni_razgovori', 'Broj individualnih razgovora sa roditeljima', 0, 500, strogo, 'roditelji'),
      eCijeli(r, 'roditeljski_sastanci', 'Broj roditeljskih sastanaka', 0, 50, strogo, 'roditelji'),
      eCijeli(r, 'pisana_komunikacija', 'Broj pisanih komunikacija sa roditeljima', 0, 1000, strogo, 'roditelji'),
      eTekst(r, 'biljeske', 'Sažetak saradnje sa roditeljima', 30, 2000, strogo, 'roditelji'));

    // Radionice
    let stavke;
    if ('stavke' in rad && !Array.isArray(rad.stavke)) { e.push(G('radionice.stavke', 'TIP', 'Radionice moraju biti lista.')); stavke = []; }
    else stavke = rad.stavke === undefined ? [] : rad.stavke;
    if (stavke.length > 30) e.push(G('radionice.stavke', 'PREVISE', 'Najviše 30 radionica po izvještaju.'));
    else {
      stavke.forEach((x, i) => {
        const put = `radionice.stavke.${i}`;
        if (!isObj(x)) { e.push(G(put, 'TIP', 'Radionica mora biti objekat.')); return; }
        const st = tk(x, 'status');
        e = e.concat(
          eEnum(x, 'ciljna_grupa', 'Ciljna grupa radionice', ENUM.grupe, true, put),
          eTekst(x, 'naslov', 'Naslov radionice', 5, 150, true, put),
          eDatum(x, 'datum', 'Datum radionice', true, put, od, doo),
          eCijeli(x, 'trajanje_min', 'Trajanje radionice (minute)', 15, 480, true, put),
          eEnum(x, 'status', 'Status radionice', ENUM.radStatus, true, put),
          eCijeli(x, 'ucesnika', 'Broj učesnika', 0, 500, strogo || st === 'održano', put),
          eTekst(x, 'ishod', 'Ishod radionice', 20, 1000, strogo && st === 'održano', put),
          eEnum(x, 'qp05_zapis', 'Zavedeno u zapis QP 05 (Evidencija obuke, QP 05.EO-02)', ENUM.daNe, strogo || st === 'održano', put));
        if (st === 'održano' && (ci(x, 'ucesnika') || 0) < 1 && 'ucesnika' in x)
          e.push(G(`${put}.ucesnika`, 'RASPON', 'Održana radionica mora imati najmanje jednog učesnika.'));
      });
      e = e.concat(eTekst(rad, 'nema_obrazlozenje', 'Obrazloženje izostanka radionica', 20, 1000, strogo && stavke.length === 0, 'radionice'));
    }

    // Stručno usavršavanje
    if ('stavke' in usv && !Array.isArray(usv.stavke)) e.push(G('usavrsavanje.stavke', 'TIP', 'Stručno usavršavanje mora biti lista.'));
    else {
      const sv = usv.stavke === undefined ? [] : usv.stavke;
      if (sv.length > 30) e.push(G('usavrsavanje.stavke', 'PREVISE', 'Najviše 30 stavki stručnog usavršavanja.'));
      else sv.forEach((x, i) => {
        const put = `usavrsavanje.stavke.${i}`;
        if (!isObj(x)) { e.push(G(put, 'TIP', 'Stavka mora biti objekat.')); return; }
        e = e.concat(
          eTekst(x, 'naslov', 'Naslov usavršavanja', 5, 150, true, put),
          eEnum(x, 'vrsta', 'Vrsta usavršavanja', ENUM.usavrsavanje, true, put),
          eCijeli(x, 'sati', 'Broj sati', 1, 100, true, put),
          eDatum(x, 'datum', 'Datum usavršavanja', true, put, od, doo));
      });
    }

    e = e.concat(
      eCijeli(a, 'kreativni_planirano', 'Kreativni časovi planirani (QP 09.PO-01)', 0, 200, strogo, 'administracija'),
      eCijeli(a, 'kreativni_odrzano', 'Održani kreativni časovi', 0, 200, strogo, 'administracija'),
      eCijeli(a, 'kreativni_posjeceno', 'Posjećeni kreativni časovi evidentirani na QP 09.PC-02', 0, 200, strogo, 'administracija'),
      eEnum(a, 'ednevnik', 'Stanje eDnevnika', ENUM.ednevnik, strogo, 'administracija'),
      eTekst(a, 'mooks_sazetak', 'Sažetak prepiske sa MOOKS-om', 20, 1500, strogo, 'administracija'),
      eTekst(a, 'dokumentacija', 'Napomene o dokumentaciji', 1, 1500, false, 'administracija'),
      eTekst(z, 'postignuca', 'Ključna postignuća u mjesecu', 50, 2000, strogo, 'zakljucak'),
      eTekst(z, 'plan_sljedeci', 'Plan za sljedeći mjesec', 50, 2000, strogo, 'zakljucak'));
    const kp = ci(a, 'kreativni_planirano'), ko = ci(a, 'kreativni_odrzano'), kv = ci(a, 'kreativni_posjeceno');
    if (ko !== null && kv !== null && kv > ko) e.push(G('administracija.kreativni_posjeceno', 'NEUSKLADJENO', 'Broj posjećenih kreativnih časova ne može biti veći od broja održanih.'));
    e = e.concat(eTekst(a, 'kreativni_napomena', 'Obrazloženje odstupanja kod kreativnih časova', 20, 1000,
      strogo && kp !== null && ko !== null && kv !== null && (kp !== ko || kv < ko), 'administracija'));
    return e;
  }

  function provjeriRizike(r, strogo) {
    if (!Array.isArray(r)) return [G('rizici', 'TIP', 'Rizici moraju biti lista.')];
    if (r.length > 100) return [G('rizici', 'PREVISE', 'Najviše 100 rizika po izvještaju.')];
    let e = []; const ids = [];
    r.forEach((x, i) => {
      const put = `rizici.${i}`;
      if (!isObj(x)) { e.push(G(put, 'TIP', 'Rizik mora biti objekat.')); return; }
      if ('id' in x && x.id !== null) {
        if (typeof x.id !== 'string' || !jeUuid(x.id)) e.push(G(`${put}.id`, 'TIP', 'Identifikator rizika nije ispravan.'));
        else if (ids.includes(x.id)) e.push(G(`${put}.id`, 'DUPLIKAT', 'Isti rizik je naveden više puta.'));
        else ids.push(x.id);
      }
      e = e.concat(
        eEnum(x, 'kategorija', 'Kategorija rizika', ENUM.kategorija, true, put),
        eEnum(x, 'ozbiljnost', 'Ozbiljnost rizika', ENUM.ozbiljnost, true, put),
        eEnum(x, 'status', 'Status rizika', ENUM.statusRizika, true, put),
        eTekst(x, 'opis', 'Opis rizika', 10, 500, true, put),
        eTekst(x, 'mjera', 'Korektivna mjera', 10, 500, strogo, put),
        eDatum(x, 'rok', 'Rok mjere', strogo, put, null, null));
    });
    return e;
  }

  function provjeriPreporuke(p, strogo) {
    if (!Array.isArray(p)) return [G('preporuke', 'TIP', 'Preporuke moraju biti lista.')];
    if (p.length > 50) return [G('preporuke', 'PREVISE', 'Najviše 50 preporuka po izvještaju.')];
    let e = []; const ids = [];
    p.forEach((x, i) => {
      const put = `preporuke.${i}`;
      if (!isObj(x)) { e.push(G(put, 'TIP', 'Preporuka mora biti objekat.')); return; }
      if ('id' in x && x.id !== null) {
        if (typeof x.id !== 'string' || !jeUuid(x.id)) e.push(G(`${put}.id`, 'TIP', 'Identifikator preporuke nije ispravan.'));
        else if (ids.includes(x.id)) e.push(G(`${put}.id`, 'DUPLIKAT', 'Ista preporuka je navedena više puta.'));
        else ids.push(x.id);
      }
      e = e.concat(
        eTekst(x, 'naslov', 'Naslov preporuke', 5, 150, true, put),
        eTekst(x, 'obrazlozenje', 'Obrazloženje preporuke', 20, 1000, strogo, put),
        eEnum(x, 'utjecaj', 'Utjecaj na resurse', ENUM.utjecaj, true, put));
    });
    return e;
  }

  /* ---------- KPI ---------- */
  function kpi(s, r, godina, mjesec) {
    const n = obj(s, 'nastavnici'), u = obj(s, 'ucenici');
    const pl = ci(n, 'posjete_planirano'), re = ci(n, 'posjete_realizirano');
    const kraj = krajMjeseca(godina, mjesec);
    const lista = Array.isArray(r) ? r : [];
    const otvoren = x => x.status !== 'Riješeno';
    const po = { 'Kritičan': 0, 'Visok': 0, 'Srednji': 0, 'Nizak': 0 };
    lista.forEach(x => { if (otvoren(x) && x.ozbiljnost in po) po[x.ozbiljnost]++; });
    return {
      kpi01: {
        planirano: pl, realizirano: re,
        stopa: (pl === null || re === null || pl === 0) ? null : Math.round(1000 * re / pl) / 10,
        nije_planirano: pl === 0,
        premaseno: (pl !== null && re !== null && re > pl) ? re - pl : 0,
      },
      kpi02: { sesije: ci(u, 'individualni_razgovori') },
      kpi03: {
        rijeseno_3a: lista.filter(x => x.status === 'Riješeno').length,
        preneseno_3b: lista.filter(x => x.prenesen === true).length,
        aktivno_3c: lista.filter(otvoren).length,
        po_ozbiljnosti: po,
        kasne_mjere: lista.filter(x => otvoren(x) && jeDatum(x.rok) && x.rok < kraj).length,
        novi: lista.filter(x => x.prenesen !== true).length,
      },
    };
  }
