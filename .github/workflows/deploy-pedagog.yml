
name: Deploy IDSS Pedagog Webapp

on:
  push:
    branches:
      - main
    paths:
      - 'IDSS/_KANON/09_IZVJESTAJI/Pedagog/webapp/**'
      - '.github/workflows/deploy-pedagog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-pedagog
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site
          cp -R "IDSS/_KANON/09_IZVJESTAJI/Pedagog/webapp/." _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
